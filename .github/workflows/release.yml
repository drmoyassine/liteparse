# npm trusted publishing (OIDC) — publishes with NO stored tokens and NO 2FA
# prompts. Pair with the one-time npmjs.com setup:
#
#   npmjs.com → @drmoyassine/liteparse → Settings → Trusted Publisher → Add:
#     Repository owner:    drmoyassine
#     Repository name:     liteparse
#     Workflow filename:   release.yml   (exact — with .yml, case-sensitive)
#     Environment:         (leave blank)
#
# npm does NOT verify this registration when you save it — mismatches only
# surface at publish time as ENEEDAUTH.
#
# Then every release is: bump version in package.json, commit, and
#   git tag v0.4.1 && git push origin v0.4.1
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # the OIDC token npm exchanges for publish rights

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Mirrors the official trusted-publishing example exactly: registry-url
      # set, NO NODE_AUTH_TOKEN — the OIDC identity from id-token: write IS
      # the credential. Provenance is automatic under trusted publishing.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5 — but stay ON major 11: npm 12
      # disables remote-tarball deps by default (EALLOWREMOTE) and this repo
      # pins xlsx to the SheetJS CDN tarball.
      - run: npm install -g npm@11

      - run: npm ci

      - name: Tag must match package.json version
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "${{ github.ref_name }}" ]; then
            echo "tag ${{ github.ref_name }} != package.json $v — bump package.json first" >&2
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test

      # Prove the runner can mint an OIDC token (id-token: write effective on
      # this job). 200 + {"value":"eyJ..."} = good; 403 = permission problem.
      - name: OIDC probe (debug)
        run: |
          code=$(curl -s -o /tmp/oidc.json -w "%{http_code}" \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm")
          echo "oidc status=$code"
          head -c 160 /tmp/oidc.json; echo

      # prepublishOnly rebuilds. --access=public: scoped packages default to
      # restricted. Prove the version in the log: trusted publishing needs
      # npm >= 11.5.1.
      - run: node --version && npm --version

      # setup-node@v6 exports NODE_AUTH_TOKEN='XXXXX-XXXXX-XXXXX-XXXXX' (a
      # literal dummy) whenever registry-url is set — and ANY token value makes
      # npm skip the OIDC exchange and PUT with the dummy, which npmjs denies
      # as a masked 404. Empty it per-step so npm sees "no auth" and does the
      # exchange.
      # --loglevel=verbose: npm's oidc() logs WHY the trusted-publishing token
      # exchange failed (e.g. the registry's registration-mismatch message)
      # only at verbose — at notice it fails silently into ENEEDAUTH.
      - run: npm publish --access=public --loglevel=verbose
        env:
          NODE_AUTH_TOKEN: ""
